<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>MedArbeiter Zugangscodes</title>
  <link rel="stylesheet" href="tafel.css" />
</head>
<body>
  <header class="kopf">
    <img src="icons/48.png" alt="" width="24" height="24" />
    <b>Zugangscodes</b>
    <span id="seite" class="seite"></span>
    <a id="neu" href="#" target="_blank" title="Zugang im Hub anlegen" aria-label="Zugang im Hub anlegen">＋</a>
    <a id="optionen" href="#" title="Einstellungen" aria-label="Einstellungen">⚙</a>
  </header>
  <div id="pause" class="pause">
    <span id="pause-stand"></span>
    <button id="pause-knopf" type="button">Pausieren</button>
  </div>
  <ul id="pause-wahl" class="pause-wahl" hidden>
    <li><button type="button" data-pause="seite">Auf dieser Seite aus</button></li>
    <li><button type="button" data-pause="stunde">Für eine Stunde</button></li>
    <li><button type="button" data-pause="morgen">Bis morgen früh</button></li>
    <li><button type="button" data-pause="aus">Erweiterung ausschalten</button></li>
  </ul>
  <input id="suche" class="suche" placeholder="Dienst oder Konto suchen …" autofocus />
  <p id="hinweis" class="hinweis" hidden></p>
  <ul id="liste"></ul>
  <footer class="fuss"><span id="rest"></span><span id="status"></span></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
